name = "qifu-nav"
compatibility_date = "2024-09-01"
pages_build_output_dir = "public"

# KV 绑定（重要）：Pages 通过 Git 部署时，KV 绑定不能在 wrangler.toml 里配置
# （kv_namespaces 是 Workers 专用字段，Pages 会校验 id 导致报错）。
# 必须在 Cloudflare Dashboard 的 Pages 项目里添加：
#   设置(Settings) → Functions → KV namespace bindings → Add binding
#   Variable name 填：NAV_KV
# 命名空间可新建或使用已有的。绑定后重新部署即可生效。
